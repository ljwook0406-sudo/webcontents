<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>설문조사</title>
        <style>
            body {
                background-color: aliceblue;
                font-family: "휴먼편지체";
            }

            h3 {
                text-align: center;
                color: red;
            }

            hr {
                border: 1px solid #aaa;
            }

            form {
                background-color: pink;
                padding: 20px;
                line-height: 2em;
            }

            footer {
                background-color: orange;
                border-radius: 12px;
                border: 2px solid darkorange;
                padding: 8px 16px;
                margin-top: 10px;
                font-style: italic;
            }
        </style>
    </head>
    <body>
        <h3>설문지</h3>
        <p>소프트웨어 기술에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.</p>
        <hr>
        <form>
            학년
            <label>
            <input type="radio" name="grade" value="1" checked>
            1학년</label>
            <label>
            <input type="radio" name="grade" value="2">
            2학년</label>
            <label>
            <input type="radio" name="grade" value="3">
            3학년</label><br>

            성별
            <label>
            <input type="radio" name="gen" value="1">
            남</label>
            <label>
            <input type="radio" name="gen" value="2">
            여</label><br>

            관심 분야
            <select name="like">
                <option value="1">모바일 소프트웨어</option>
                <option value="2">모바일 소프트웨어</option>
                <option value="3">모바일 소프트웨어</option>
            </select><br>

            진로
            <label>
            <input type="checkbox" value="1" checked>개발</label>
            <label>
            <input type="checkbox" value="2">기획</label>
            <label>
            <input type="checkbox" value="3">영업</label>
            <label>
            <input type="checkbox" value="4">창업</label><br>

            남기고 싶은 말
            <textarea cols="30" rows="5" placeholder="글을 남겨주세요"></textarea><br>
        </form>
        <footer>
            Copyright 2026 by MYONGJI COLLEGE
        </footer>
    </body>
</html>
