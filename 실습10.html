<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>transition</title>
    <style>
        img {
            width: 200px;
            transition: width 3s;
        }
        img:hover {
            width: 100%;
        }
    </style>
</head>
<body>
    <img src="media/spongebob.png" alt="spongebob">
</body>
</html>
