<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>색 테이블 만들기</title>
        <style>
            #brown {background-color: brown;
                width: 50px;
                height: 25px;
                
            }
            #deepskyblue {background-color: deepskyblue;
                width: 50px;
                height: 25px;
                
            }
            #blueviolet {background-color: blueviolet;
                width: 50px;
                height: 25px;
                
            }
            #gold {background-color: gold;
                width: 50px;
                height: 25px;
                
            }
            #darkorange {background-color: darkorange;
                width: 50px;
                height: 25px;
                
            }
            #olivedrab {background-color: olivedrab;
                width: 50px;
                height: 2px;
                
            }
        </style>
    </head>
    <body>
        <h3>색 이름과 코드</h3>
        <hr>
        <table border="1">
            <thead>
                <tr><th>이름</th><th>코드</th><th>색</th><th>이름</th><th>코드</th><th>색</th></tr>
            </thead>
            <tbody>
                <tr><td>brown<td>#A52A2A</td><td><div id="brown"></div></td><td>deepskyblue</td><td>#00BFFF</td><td><div id="deepskyblue"></div></td></tr>
                <tr><td>blueviolet<td>#8A2BE2</td><td><div id="blueviolet"></div></td><td>gold</td><td>#FFD700</td><td><div id="gold"></div></td></tr>
                <tr><td>darkorange<td>#FF8C00</td><td><div id="darkorange"></div><td>olivedrab</td><td>#6B8E23</td><td><div id="olivedrab"></div></td></tr>
            </tbody>
        </table>
    </body>
</html>
